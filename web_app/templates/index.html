<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>boss智能投递助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%22100%22 y2=%22100%22><stop offset=%220%22 stop-color=%22%234a7cff%22/><stop offset=%22100%22 stop-color=%22%231e4bd2%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22url(%23g)%22/><g transform=%22translate(24,22) scale(1.35)%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M22 2 11 13%22/><path d=%22M22 2 15 22l-4-9-9-4Z%22/></g></svg>">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
/* taste-skill: DESIGN_VARIANCE=5, MOTION_INTENSITY=4, VISUAL_DENSITY=5
   Dual theme system — Light / Dark */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* Light Theme - default when no data-theme set */
[data-theme="light"], :root{
  --bg:#f5f6fa;--surface:#ffffff;--surface-soft:#f0f1f5;--surface-hover:#e8e9ee;
  --accent:#4a7cff;--accent-light:#e8eeff;--accent-hover:#3a6ae8;
  --success:#10b981;--success-bg:#d1fae5;--warning:#f59e0b;--warning-bg:#fef3c7;
  --danger:#ef4444;--danger-bg:#fee2e2;--info:#3b82f6;--info-bg:#dbeafe;
  --fg:#1e1e2e;--fg-2nd:#5a5d6e;--fg-3rd:#8b8fa0;--fg-4th:#b0b4c4;
  --bd:#e2e4ea;--bd-2:#d0d2da;
  --sh-sm:0 1px 2px rgba(0,0,0,.04);--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(0,0,0,.08);--sh-lg:0 8px 32px rgba(0,0,0,.12);
  --side-bg:#ffffff;
  --side-text:#1e1e2e;--side-input-bg:rgba(0,0,0,.03);--side-input-bd:rgba(0,0,0,.06);
  --side-label:rgba(0,0,0,.25);
  --chip-bg:#e8eeff;--chip-text:#4a7cff;--chip-del:rgba(74,124,255,.3);
  --modal-overlay:rgba(0,0,0,.3);--scrollbar-thumb:#d0d2da;
  --img-checked-bd:#4a7cff;--img-checked-bg:rgba(74,124,255,.08);
  /* 设计 tokens（原引用但缺失，补全：圆角/过渡/顶栏高度） */
  --r-sm:10px;--r-md:16px;--r-lg:24px;--dur:.18s;--ease:cubic-bezier(.2,.8,.3,1);--header-h:52px;
  /* 布局：侧栏可调宽度（分割条拖动 / 折叠按钮） */
  --side-w:360px;
  /* 玻璃拟态 tokens（浅色） */
  --glass-bg:rgba(255,255,255,.62);--glass-bg-soft:rgba(255,255,255,.42);--glass-btn-bg:rgba(255,255,255,.55);
  --glass-bd:rgba(255,255,255,.65);--glass-blur:blur(24px) saturate(1.6);
  --glass-sh:0 8px 32px rgba(15,23,42,.08);--glass-inset:inset 0 1px 0 rgba(255,255,255,.55);
  --hover-glass:rgba(15,23,42,.05);
}

[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1d27;--surface-soft:#22252f;--surface-hover:#2a2d38;
  --accent:#4a7cff;--accent-light:#1e2a4a;--accent-hover:#6b96ff;
  --success:#34d399;--success-bg:#064e3b;--warning:#fbbf24;--warning-bg:#78350f;
  --danger:#f87171;--danger-bg:#450a0a;--info:#60a5fa;--info-bg:#1e3a5f;
  --fg:#f0f2f5;--fg-2nd:#b0b5c0;--fg-3rd:#6b7280;--fg-4th:#4b5563;
  --bd:#2a2d38;--bd-2:#3b3f4a;
  --sh-sm:0 1px 2px rgba(0,0,0,.2);--sh:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --sh-md:0 4px 16px rgba(0,0,0,.4);--sh-lg:0 8px 32px rgba(0,0,0,.5);
  --side-bg:#1a1d27;
  --side-text:#f0f2f5;--side-input-bg:rgba(255,255,255,.05);--side-input-bd:rgba(255,255,255,.08);
  --side-label:rgba(255,255,255,.35);
  --chip-bg:#1e2a4a;--chip-text:#4a7cff;--chip-del:rgba(74,124,255,.3);
  --modal-overlay:rgba(0,0,0,.6);--scrollbar-thumb:#3b3f4a;
  --img-checked-bd:#4a7cff;--img-checked-bg:rgba(74,124,255,.12);
  /* 玻璃拟态 tokens（深色） */
  --glass-bg:rgba(23,26,36,.55);--glass-bg-soft:rgba(255,255,255,.05);--glass-btn-bg:rgba(255,255,255,.06);
  --glass-bd:rgba(255,255,255,.09);--glass-blur:blur(24px) saturate(1.4);
  --glass-sh:0 10px 40px rgba(0,0,0,.42);--glass-inset:inset 0 1px 0 rgba(255,255,255,.06);
  --hover-glass:rgba(255,255,255,.08);
}

/* Theme transitions */
html{transition:color-scheme .3s ease}
body{transition:background-color .3s ease,color .3s ease}

/* Base */
html,body{height:100%}
body{transition:background-color .3s ease,color .3s ease}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans SC,sans-serif;font-size:13.5px;line-height:1.55;background:var(--bg);color:var(--fg);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:transparent;width:100%}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
.hidden{display:none!important}

/* Layout */
.app{display:flex;width:100%;height:100%;position:relative}
.side{flex:0 0 var(--side-w,360px);width:var(--side-w,360px);display:flex;flex-direction:column;background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);color:var(--side-text);position:relative;z-index:10;border-right:1px solid var(--glass-bd);overflow:hidden;box-shadow:var(--glass-sh),var(--glass-inset);transition:flex-basis .28s var(--ease),width .28s var(--ease),border-color .28s var(--ease),transform .28s var(--ease)}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--side-input-bd);flex-shrink:0}
.side-head .logo-wrap{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4a7cff,#1e4bd2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(30,75,210,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s ease}.side-head .logo-wrap:hover{transform:scale(1.08)}
.side-head .logo-text{font-size:14px;font-weight:600;flex:1;letter-spacing:-.02em}
.side-head .conn-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;background:var(--success-bg);color:var(--success)}
.side-head .conn-badge.disconnected{background:var(--danger-bg);color:var(--danger)}
.side-scroll{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.side-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--side-label);margin-bottom:8px;padding:0 4px;display:flex;align-items:center;gap:6px}
.side-section-title .badge-count{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--side-input-bg);color:var(--fg-3rd);font-weight:600}
.side-footer{flex-shrink:0;padding:10px 16px;border-top:1px solid var(--side-input-bd);display:flex;align-items:center;gap:8px;font-size:11px}

/* Sidebar splitter (拖动调节两侧比例) */
.splitter{flex:0 0 5px;cursor:col-resize;position:relative;z-index:8;background:transparent;touch-action:none;transition:background var(--dur) var(--ease)}
.splitter::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--glass-bd);transition:background var(--dur) var(--ease)}
.splitter:hover,.splitter.dragging{background:rgba(74,124,255,.08)}
.splitter:hover::after,.splitter.dragging::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
body.resizing .app{pointer-events:none}
body.resizing .splitter{pointer-events:auto}

/* Sidebar toggle button (折叠按钮) */
.sidebar-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--glass-btn-bg);border:1px solid var(--glass-bd);color:var(--fg-2nd);flex-shrink:0;transition:all var(--dur) var(--ease);box-shadow:var(--glass-inset)}
.sidebar-toggle:hover{background:var(--hover-glass);color:var(--fg)}
.sidebar-toggle:active{transform:scale(.94)}

/* 折叠态（桌面） */
.app.side-collapsed .side{flex-basis:0;width:0;border-right-color:transparent}
.app.side-collapsed .splitter{opacity:0;pointer-events:none}

/* 窄屏遮罩 + 覆盖式侧栏 */
.side-mask{position:fixed;inset:0;background:var(--modal-overlay);z-index:55;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s ease}


/* Advanced settings collapsible */
.adv-toggle{cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:4px;transition:all var(--dur) var(--ease);font-size:10.5px;font-weight:600;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;margin-top:14px;width:100%;border:none;background:none}
.adv-toggle:hover{background:var(--surface-hover);color:var(--fg)}
.adv-toggle .arrow{transition:transform .2s ease;font-size:8px;margin-left:auto}
.adv-toggle.open .arrow{transform:rotate(90deg)}
.adv-section{overflow:hidden;max-height:0;transition:max-height .3s ease;display:flex;flex-direction:column;gap:8px}
.adv-section.open{max-height:2000px}
.adv-field-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2nd);padding:2px 0}
.adv-field-row label{flex-shrink:0;font-size:10.5px;font-weight:500;color:var(--side-label);min-width:56px}
.adv-field-row .side-form-input{flex:1}
.adv-group-title{font-size:10px;font-weight:600;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;padding:4px 0 2px;border-bottom:1px solid var(--side-input-bd)}

/* Account tabs */
.account-tab{display:inline-block;padding:5px 10px;font-size:11.5px;font-weight:500;border-radius:4px;background:var(--side-input-bg);color:var(--fg-2nd);border:1px solid var(--side-input-bd);transition:all var(--dur) var(--ease);cursor:pointer;margin-right:4px;margin-bottom:4px}
.account-tab:hover{background:var(--surface-hover);color:var(--fg)}
.account-tab.active{background:rgba(74,124,255,.15);color:#4a7cff;border-color:rgba(74,124,255,.3)}
.account-tab .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-weight:600;margin-left:4px}
.account-tab.active .badge{background:rgba(74,124,255,.25);color:#4a7cff}

/* Forms */
.side-form-group{display:flex;flex-direction:column;gap:4px}
.side-form-label{font-size:10.5px;font-weight:500;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em}
.side-form-input,.side-form-select{font-size:12px;padding:7px 10px;border-radius:4px;background:var(--side-input-bg);border:1px solid var(--side-input-bd);color:var(--fg);transition:all var(--dur) var(--ease)}
.side-form-input:focus,.side-form-select:focus{border-color:rgba(74,124,255,.5);box-shadow:0 0 0 2px rgba(74,124,255,.15)}
.side-form-input::placeholder{color:var(--fg-4th)}
.side-form-select option{background:var(--surface);color:var(--fg)}
.acc-field-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2nd)}
.acc-field-row label{flex-shrink:0;font-size:10.5px;font-weight:500;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;min-width:48px}

/* File upload */
.file-input-wrap{display:flex;flex:1;gap:4px}
.file-input-wrap .side-form-input{flex:1}
.file-btn{flex-shrink:0;padding:6px 10px;font-size:10.5px;font-weight:500;border-radius:4px;background:rgba(74,124,255,.2);color:#4a7cff;border:1px solid rgba(74,124,255,.25);transition:all var(--dur) var(--ease);white-space:nowrap}
.file-btn:hover{background:rgba(74,124,255,.3)}

/* Toggle switch */
.toggle-switch{position:relative;display:inline-block;width:32px;height:18px;border-radius:9px;background:var(--bd-2);cursor:pointer;transition:all var(--dur) var(--ease);flex-shrink:0}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:all var(--dur) var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle-switch.on{background:linear-gradient(180deg,#7eb2ff,#4a7cff);box-shadow:0 0 0 3px rgba(74,124,255,.14),0 1px 4px rgba(74,124,255,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.toggle-switch.on::after{left:16px;background:#fff}

/* Buttons */
.side-btn-row{display:flex;gap:6px;align-items:center}
.side-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;font-size:11px;font-weight:500;border-radius:4px;transition:all var(--dur) var(--ease);white-space:nowrap}
.side-btn-ghost{background:var(--glass-btn-bg);color:var(--fg-2nd);border:1px solid var(--side-input-bd)}
.side-btn-ghost:hover{background:var(--hover-glass);color:var(--fg)}
.side-btn:active{transform:scale(.97)}
.side-btn-sm{padding:4px 8px;font-size:10px}
.side-btn-danger{color:var(--danger)!important}
.side-btn-block{width:100%}

/* Image multi-select grid */
.image-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-height:150px;overflow-y:auto;padding:1px}
.image-grid-item{position:relative;border-radius:var(--r-sm);overflow:hidden;border:2px solid transparent;transition:all var(--dur) var(--ease);aspect-ratio:16/10;cursor:grab}
.image-grid-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.image-grid-item.dragging{opacity:.5;transform:scale(.96);border-color:var(--accent)}
.image-grid-item.checked{border-color:var(--img-checked-bd);background:var(--img-checked-bg)}
.image-grid-item .img-select{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;cursor:pointer;transition:all var(--dur) var(--ease);z-index:2}
.image-grid-item .img-select:hover{transform:scale(1.12)}
.image-grid-item.checked .img-select{background:linear-gradient(180deg,#7eb2ff,#4a7cff);box-shadow:0 0 0 3px rgba(74,124,255,.18)}
.image-grid-item .img-select .check-icon{opacity:0;transition:opacity var(--dur) var(--ease)}
.image-grid-item.checked .img-select .check-icon{opacity:1}
.image-grid-item .img-del-btn{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:rgba(220,38,38,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;opacity:0;transition:opacity .15s ease;z-index:3;line-height:1}
.image-grid-item:hover .img-del-btn{opacity:1}
.image-grid-item .img-del-btn:hover{background:#dc2626;transform:scale(1.15)}
.image-grid-item .img-rename-btn{position:absolute;right:2px;bottom:11px;width:12px;height:12px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;opacity:0;transition:opacity .15s ease;z-index:3;line-height:1}
.image-grid-item:hover .img-rename-btn{opacity:1}
.image-grid-item .img-rename-btn:hover{background:rgba(15,23,42,.8);transform:scale(1.15)}
.image-grid-item .img-name{position:absolute;bottom:0;left:0;right:0;padding:1px 3px;font-size:6.5px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* Chips */
.chip-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;font-size:10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);max-width:100%;transition:all var(--dur) var(--ease)}
.chip .chip-remove{cursor:pointer;font-size:12px;line-height:1;opacity:.6;transition:opacity var(--dur) var(--ease);margin-left:2px;color:var(--chip-del)}
.chip .chip-remove:hover{opacity:1}

.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.idle{background:var(--fg-4th)}
.status-dot.running{background:#34d399;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(52,211,153,0)}}
.status-text{font-size:11px;font-weight:500;color:var(--fg-3rd)}
.status-label{font-size:10px;color:var(--fg-4th);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.topbar{display:flex;align-items:center;padding:0 24px;height:var(--header-h);border-bottom:1px solid var(--glass-bd);background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);flex-shrink:0;gap:12px;box-shadow:var(--glass-inset)}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-.02em}
.topbar-title .highlight{color:var(--accent)}
.topbar-task{font-size:11px;color:var(--fg-3rd);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.topbar-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-light);color:var(--accent);letter-spacing:.02em}

/* Theme toggle button */
.theme-toggle{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:var(--glass-btn-bg);border:1px solid var(--bd);transition:all var(--dur) var(--ease);font-size:11px;font-weight:500;color:var(--fg-2nd);box-shadow:var(--glass-inset)}
.theme-toggle:hover{background:var(--hover-glass);color:var(--fg)}
.theme-toggle:active{transform:scale(.97)}
.theme-toggle .toggle-icon{font-size:14px;line-height:1}

/* Content */
.content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{padding:12px 14px;border-radius:var(--r-sm);background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);box-shadow:var(--glass-inset);transition:all var(--dur) var(--ease)}
.stat-card:hover{background:var(--hover-glass);border-color:var(--bd-2)}
.stat-card.accent .stat-label::before,.stat-card.success .stat-label::before,.stat-card.warning .stat-label::before,.stat-card.info .stat-label::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor;color:var(--fg-4th)}
.stat-card.accent .stat-label::before{color:var(--accent)}
.stat-card.success .stat-label::before{color:var(--success)}
.stat-card.warning .stat-label::before{color:var(--warning)}
.stat-card.info .stat-label::before{color:var(--info)}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3rd)}
.stat-value{font-size:20px;font-weight:700;margin:2px 0;letter-spacing:-.03em;color:var(--fg)}
.stat-sub{font-size:10.5px;color:var(--fg-4th)}

/* Button variants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:500;border-radius:var(--r-sm);transition:all var(--dur) var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-success{background:var(--success);color:#fff;box-shadow:0 1px 2px rgba(16,185,129,.25),0 4px 12px rgba(16,185,129,.18)}
.btn-success:hover{background:#059669;box-shadow:0 2px 4px rgba(16,185,129,.3),0 8px 20px rgba(16,185,129,.26)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 1px 2px rgba(239,68,68,.25),0 4px 12px rgba(239,68,68,.18)}
.btn-danger:hover{background:#dc2626;box-shadow:0 2px 4px rgba(239,68,68,.3),0 8px 20px rgba(239,68,68,.26)}
.btn-ghost{background:var(--glass-btn-bg);color:var(--fg-2nd);border:1px solid var(--bd);box-shadow:var(--glass-inset)}
.btn-ghost:hover{background:var(--hover-glass);color:var(--fg);border-color:var(--bd-2)}

/* Panels */
.panel-row{display:flex;gap:16px;flex:1;min-height:0}
.panel{display:flex;flex-direction:column;background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r-md);box-shadow:var(--glass-sh),var(--glass-inset);overflow:hidden}
.panel-half{flex:1}.panel-full{flex:1;min-width:0}
.panel-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;gap:6px}
.panel-icon{font-size:14px}
.panel-title{font-size:12px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.panel-actions{margin-left:auto;display:flex;gap:4px}
.panel-body{flex:1;overflow-y:auto;padding:8px 12px}

/* Job list */
.job-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);margin-bottom:6px;transition:all var(--dur) var(--ease);cursor:pointer}
.job-item:hover{background:var(--surface-soft);border-color:var(--bd-2)}
.job-item .job-info{flex:1;min-width:0}
.job-item .job-query{font-size:13px;font-weight:500;color:var(--fg)}
.job-item .job-city{font-size:10px;color:var(--fg-3rd);margin-top:1px}
.job-item .job-badge{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--accent-light);color:var(--accent);font-weight:500}
.job-item .job-del{font-size:14px;color:var(--fg-4th);cursor:pointer;padding:2px 4px;border-radius:3px;transition:all var(--dur) var(--ease)}
.job-item .job-del:hover{color:var(--danger);background:var(--danger-bg)}
.job-item .job-toggle{flex-shrink:0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px}
.empty-icon{font-size:32px;opacity:.5}
.empty-title{font-size:14px;font-weight:600;color:var(--fg-2nd)}
.empty-desc{font-size:11px;color:var(--fg-3rd)}

/* Log */
.log-area{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;padding:8px 12px}
.log-entry{padding:2px 0;display:flex;gap:8px;word-break:break-all}
.log-time{color:var(--fg-4th);flex-shrink:0;font-size:10px}
.log-message{flex:1}
.log-SYSTEM,.log-INFO{color:var(--fg-2nd)}
.log-SUCCESS{color:var(--success)}
.log-ERROR{color:var(--danger)}
.log-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px;color:var(--fg-3rd)}
.monitor-card{border:1px solid var(--bd);border-radius:var(--r-md);background:var(--side-input-bg);padding:10px 12px;margin-bottom:10px}
.mcard-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mcard-title{font-size:12px;font-weight:600;color:var(--fg)}
.mcard-hr{font-size:11px;color:var(--fg-2nd);background:var(--bd);border-radius:6px;padding:4px 8px;margin-bottom:6px;word-break:break-all}
.mcard-input{width:100%;min-height:52px;border:1px solid var(--bd);border-radius:6px;background:var(--surface);color:var(--fg);padding:6px 8px;font-size:12px;font-family:inherit;resize:vertical;box-sizing:border-box}
.mcard-actions{display:flex;gap:6px;margin-top:6px;align-items:center}
.mcard-state{font-size:11px;margin-left:auto}
.mcard-state.ok{color:var(--success)}
.mcard-state.err{color:var(--danger)}
.mcard-state.skip{color:var(--fg-3rd)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-radius:var(--r-lg);padding:24px;width:520px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:var(--sh-lg),var(--glass-inset);border:1px solid var(--glass-bd);animation:slideUp .2s ease}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--fg)}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:11px;font-weight:500;color:var(--fg-2nd);margin-bottom:4px}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface-soft);font-size:12px;color:var(--fg);transition:all var(--dur) var(--ease)}
.modal-field input:focus,.modal-field textarea:focus,.modal-field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.modal-field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-primary{background:linear-gradient(180deg,#5b8cff,var(--accent) 45%,#3a6ae8);color:#fff;box-shadow:0 1px 2px rgba(30,75,210,.25),0 4px 14px rgba(74,124,255,.22)}
.btn-primary:hover{background:linear-gradient(180deg,#6b97ff,var(--accent-hover) 55%,#2f5bd6);box-shadow:0 2px 4px rgba(30,75,210,.3),0 8px 22px rgba(74,124,255,.32)}
.btn-cancel{background:var(--glass-btn-bg);color:var(--fg-2nd);border:1px solid var(--bd)}
.btn-cancel:hover{background:var(--hover-glass);color:var(--fg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:900px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .panel-row{flex-direction:column}
  .content{padding:16px}
  .splitter{display:none}
  .side{flex-basis:0;width:0;border-right:none}
  .app.side-overlay .side{flex-basis:auto;display:flex;position:fixed;top:0;left:0;bottom:0;width:min(var(--side-w,340px),86vw);z-index:60;border-right:1px solid var(--glass-bd);box-shadow:var(--glass-sh),var(--glass-inset)}
  .app.side-overlay .side-mask{opacity:1;pointer-events:auto}
  .app.side-overlay .splitter{display:none}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr}
  .content{padding:12px}
  .topbar{padding:0 12px}
  .topbar-task{display:none}
}

/* Login Modal */
.login-modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:9999;display:none;align-items:center;justify-content:center;animation:fadeIn .25s ease;-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%)}
.login-modal-overlay.active{display:flex}
.login-modal{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-radius:18px;padding:0;max-width:440px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,.28),var(--glass-inset);border:1px solid var(--glass-bd);animation:modalPop .28s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
.login-modal-header{background:linear-gradient(135deg,var(--accent),#1e4bd2);padding:28px 32px 24px;text-align:center;position:relative}
.login-modal-header::after{content:"";position:absolute;bottom:-12px;left:0;right:0;height:24px;background:var(--surface);border-radius:18px 18px 0 0}
.login-modal-icon{font-size:42px;line-height:1;margin-bottom:10px;display:inline-block;animation:iconBob 2.2s ease-in-out infinite;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))}
.login-modal-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.15)}
.login-modal-body{padding:20px 32px 28px;text-align:center}
.login-modal-desc{font-size:13px;color:var(--fg-2nd);margin-bottom:24px;line-height:1.7}
.login-modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.login-modal-btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;transition:all var(--dur) var(--ease);box-shadow:0 2px 8px rgba(30,75,210,.25)}
.login-modal-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 6px 18px rgba(30,75,210,.35)}
.login-modal-btn:active{transform:translateY(0)}
.login-modal-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.login-modal-btn-secondary{background:var(--surface-soft);color:var(--fg-2nd);border:1px solid var(--bd);box-shadow:none}
.login-modal-btn-secondary:hover{background:var(--surface-hover);color:var(--fg);box-shadow:0 2px 6px rgba(0,0,0,.06)}
@keyframes modalPop{0%{transform:scale(.92) translateY(8px);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes iconBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Ambient background —— 玻璃拟态需要有东西可模糊 */
.app::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(620px 440px at 10% 6%,rgba(74,124,255,.16),transparent 62%),
  radial-gradient(560px 420px at 94% 90%,rgba(52,211,153,.10),transparent 60%),
  radial-gradient(460px 360px at 80% 8%,rgba(245,158,11,.08),transparent 58%)}

/* 系统关闭透明/毛玻璃时，降级为实底（taste-skill） */
@media (prefers-reduced-transparency: reduce){
  .side,.topbar,.panel,.stat-card,.modal,.login-modal{-webkit-backdrop-filter:none;backdrop-filter:none}
  :root{--glass-bg:#ffffff;--glass-bg-soft:#f5f6fa;--glass-btn-bg:#f0f1f5}
  [data-theme="dark"]{--glass-bg:#1a1d27;--glass-bg-soft:#22252f;--glass-btn-bg:#22252f}
}

/* 按钮图标：CSS 伪元素实现，JS 里 textContent 重置不会丢失图标 */
.btn[class*="ico-"]::before{content:"";width:12px;height:12px;display:inline-block;background-size:contain;background-repeat:no-repeat;background-position:center;flex-shrink:0}
.ico-play::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M8 5v14l11-7z' fill='currentColor'/></svg>")}
.ico-stop::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='6' y='6' width='12' height='12' rx='2' fill='currentColor'/></svg>")}
.ico-check::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>")}
.ico-save::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'/><polyline points='7 10 12 15 17 10'/><line x1='12' y1='15' x2='12' y2='3'/></svg>")}
.ico-chart::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><line x1='18' y1='20' x2='18' y2='10'/><line x1='12' y1='20' x2='12' y2='4'/><line x1='6' y1='20' x2='6' y2='14'/></svg>")}
.ico-send::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 2 11 13'/><path d='M22 2 15 22l-4-9-9-4Z'/></svg>")}
.ico-skip::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='5 4 15 12 5 20 5 4' fill='currentColor'/><rect x='17' y='5' width='2' height='14' fill='currentColor'/></svg>")}
.ico-zap::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2' fill='currentColor'/></svg>")}
.ico-file::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>")}
.ico-refresh::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='23 4 23 10 17 10'/><path d='M20.49 15a9 9 0 1 1-2.12-9.36L23 10'/></svg>")}

/* 城市组合框：点开显示全部，输入时过滤，也可直接手打 */
.city-combo{position:relative}
.city-combo input{width:100%;box-sizing:border-box}
.city-combo-arrow{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--fg-3rd);pointer-events:none}
.city-combo-list{position:fixed;max-height:220px;overflow-y:auto;background:var(--surface-soft);border:1px solid var(--bd);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:2000;display:none;text-align:left;padding:4px}
.city-combo-list.show{display:block}
.city-combo-item{padding:7px 10px;font-size:12px;color:var(--fg);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px}
.city-combo-item:hover{background:var(--accent);color:#fff}
.city-combo-item.muted{color:var(--fg-3rd);cursor:default}
.city-combo-item.muted:hover{background:none;color:var(--fg-3rd)}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="side-head">
      <div class="logo-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg></div>
      <div class="logo-text">boss智能投递助手</div>
      <span class="conn-badge" id="connStatus">已连接</span>
    </div>
    <div class="side-scroll" id="sideScroll">
      <div>
        <div class="side-section-title">账号 <span class="badge-count" id="accBadge">1</span></div>
        <div id="accountTabs" style="margin-bottom:6px"></div>
        <div class="side-btn-row">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="addAccount()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加</button>
        </div>
      </div>
      <div>
        <div class="side-section-title">账号设置</div>
        <div class="acc-field-row"><label>名称</label><input class="side-form-input" id="accName" type="text" placeholder="主账号" onchange="onAccChange()"></div>
        <div class="acc-field-row"><label>Cookie</label>
          <div class="file-input-wrap">
            <input class="side-form-input" id="accCookie" type="text" placeholder="zhipin_cookies.json" onchange="onAccChange()">
            <button class="file-btn" onclick="document.getElementById('cookieFileInput').click()" title="上传 Cookie 文件"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
            <button class="file-btn" onclick="checkCookieLogin()" title="用当前 Cookie 打开浏览器验证登录状态；未登录则引导扫码登录">检查登录</button>
            <button class="file-btn" style="background:var(--danger-bg);color:var(--danger)" onclick="deleteCookieFile()">删除</button>
            <input type="file" id="cookieFileInput" class="hidden" accept=".json,.txt" onchange="uploadCookieFile(event)">
          </div>
        </div>
        <div class="acc-field-row" style="gap:6px"><label>启用</label><span id="accEnabled" class="toggle-switch on" onclick="toggleAccEnabled()"></span></div>

        <div class="side-section-title" style="margin-top:14px">岗位管理 <span class="badge-count" id="sbarJobCount">0</span></div>
        <div id="jobList" style="display:flex;flex-direction:column;min-height:40px"></div>
        <button class="side-btn side-btn-ghost side-btn-sm side-btn-block" onclick="addJob()" style="margin-top:6px;padding:8px 12px;font-size:11px;font-weight:500;border:1px dashed var(--bd-2);background:var(--side-input-bg);border-radius:6px;cursor:pointer" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--bd-2)';this.style.color='var(--fg-2nd)'">+ 添加岗位</button>

        <div class="side-section-title" style="margin-top:12px">作品图片 <span class="badge-count" id="imageCountBadge">0</span></div>
        <div id="imageGrid" class="image-grid"></div>
        <div id="imageChips" class="chip-list"></div>
        <div class="side-btn-row" style="margin-top:4px;flex-wrap:wrap">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="document.getElementById('imageFileInput').click()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 上传图片</button>
          <input type="file" id="imageFileInput" class="hidden" accept="image/*" multiple onchange="handleImageUpload(event)">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="refreshImageList()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 刷新</button>
          <button class="side-btn side-btn-danger side-btn-sm" onclick="deleteAccount(activeAccountIdx)" style="margin-left:auto;font-size:10px;color:var(--danger)">删除此账号</button>
        </div>
      </div>
      <div>
        <div class="side-section-title">AI 智能解析 <span class="badge-count" id="aiBadge">关</span></div>
        <div class="acc-field-row"><label>启用</label><span id="aiEnabled" class="toggle-switch" onclick="toggleAiEnabled()"></span></div>
        <div class="acc-field-row"><label>API Key</label><input class="side-form-input" id="aiApiKey" type="password" placeholder="sk-..." onchange="onAiChange()"></div>
        <div class="acc-field-row"><label>API 地址</label><input class="side-form-input" id="aiApiBase" type="text" placeholder="https://api.agnes-ai.cn/v1" onchange="onAiChange()"></div>
        <div class="acc-field-row"><label>模型</label><input class="side-form-input" id="aiModel" type="text" placeholder="agnes-2.5-flash" onchange="onAiChange()"></div>
        <div class="acc-field-row"><label>匹配阈值</label><input class="side-form-input" id="aiThreshold" type="number" min="0" max="100" placeholder="70" onchange="onAiChange()"></div>
        <div class="acc-field-row"><label>按匹配度排序投递</label><span id="aiSort" class="toggle-switch" onclick="toggleAiBool('sort_by_score')"></span></div>
        <div class="acc-field-row"><label>跳过不活跃 HR</label><span id="aiSkipInactive" class="toggle-switch" onclick="toggleAiBool('skip_inactive_hr')"></span></div>
        <div class="acc-field-row"><label>不活跃阈值(时)</label><input class="side-form-input" id="aiInactiveHours" type="number" min="1" max="720" placeholder="72" onchange="onAiChange()"></div>
        <div class="side-btn-row" style="margin-top:6px;flex-wrap:wrap">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="showResumeModal()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> 编辑简历</button>

<script>
const socket = io();
let config = { accounts: [] };
let activeAccountIdx = 0;
const defaultGreeting = "您好，我是双一流的本科，应聘数据分析岗位。在校系统学习数据分析相关知识，掌握Excel、基础SQL与数据整理技能，具备数据思维。做事严谨细心，学习能力强，愿意踏实积累。十分认可贵公司，希望能获得面试机会。";
let stats = { total: 0, applied: 0, skipped: 0 };

function renderAiConfig() {
  if (!config.ai) config.ai = {};
  config.ai = Object.assign({enabled:false,api_key:'',api_base:'https://api.agnes-ai.cn/v1',model:'agnes-2.5-flash',match_threshold:70,sort_by_score:true,prefer_active_hr:false,skip_inactive_hr:false,inactive_threshold_hours:72}, config.ai);
  setEl('aiEnabled', 'toggle-switch' + (config.ai.enabled ? ' on' : ''));
  setVal('aiApiKey', config.ai.api_key || '');
  setVal('aiApiBase', config.ai.api_base || 'https://api.agnes-ai.cn/v1');
  setVal('aiModel', config.ai.model || 'agnes-2.5-flash');
  setVal('aiThreshold', config.ai.match_threshold ?? 70);
  setEl('aiSort', 'toggle-switch' + (config.ai.sort_by_score ? ' on' : ''));
  setEl('aiSkipInactive', 'toggle-switch' + (config.ai.skip_inactive_hr ? ' on' : ''));
  setVal('aiInactiveHours', config.ai.inactive_threshold_hours ?? 72);
  const badge = document.getElementById('aiBadge');
  if (badge) badge.textContent = config.ai.enabled ? '开' : '关';
}

function toggleAiEnabled() {
  if (!config.ai) config.ai = {};
  config.ai.enabled = !config.ai.enabled;
  renderAiConfig();
  saveConfig();
  addLog('INFO', 'AI 智能解析已' + (config.ai.enabled ? '开启' : '关闭'));
}

function onAiChange() {
  if (!config.ai) config.ai = {};
  config.ai.enabled = document.getElementById('aiEnabled').classList.contains('on');
  config.ai.api_key = document.getElementById('aiApiKey').value.trim();
  config.ai.api_base = document.getElementById('aiApiBase').value.trim() || 'https://api.agnes-ai.cn/v1';
  config.ai.model = document.getElementById('aiModel').value.trim() || 'agnes-2.5-flash';
  config.ai.match_threshold = parseInt(document.getElementById('aiThreshold').value) || 70;
  config.ai.sort_by_score = document.getElementById('aiSort').classList.contains('on');
  config.ai.skip_inactive_hr = document.getElementById('aiSkipInactive').classList.contains('on');
  config.ai.inactive_threshold_hours = parseInt(document.getElementById('aiInactiveHours').value) || 72;
  renderAiConfig();
  saveConfig();
}

function toggleAiBool(key) {
  if (!config.ai) config.ai = {};
  if (key === 'sort_by_score') {
    config.ai.sort_by_score = !config.ai.sort_by_score;
    setEl('aiSort', 'toggle-switch' + (config.ai.sort_by_score ? ' on' : ''));
  } else if (key === 'skip_inactive_hr') {
    config.ai.skip_inactive_hr = !config.ai.skip_inactive_hr;
    setEl('aiSkipInactive', 'toggle-switch' + (config.ai.skip_inactive_hr ? ' on' : ''));
  }
  renderAiConfig();
  saveConfig();
  addLog('INFO', 'AI 投递策略已更新');
}

function testAi() {
  const status = document.getElementById('aiStatus');
  if (!config.ai || !config.ai.api_key) {
    if (status) status.textContent = '请先填写 API Key 并保存';
    addLog('ERROR', 'AI 测试失败: API Key 未配置');
    return;
  }
  if (status) status.textContent = '⏳ 正在测试 AI 分析...';
  onAiChange();
  saveConfig().then(function() {
    return fetch('/api/ai/config', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:config.ai.enabled, api_key:config.ai.api_key, api_base:config.ai.api_base, model:config.ai.model, match_threshold:config.ai.match_threshold})});
  }).then(r=>r.json()).then(function(data) {
    if (data.status !== 'ok') throw new Error(data.message || '保存 AI 配置失败');
    const sample = {
      job_name: '数据分析师',
      salary: '15-25K',
      description: '负责业务数据分析，输出报表与洞察，支持决策。要求掌握SQL与Excel。',
      requirements: '本科及以上，熟悉SQL、Excel，有数据思维',
      company: '示例公司',
      url: 'https://www.zhipin.com/job_detail/test.html'
    };
    return fetch('/api/ai/analyze', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({job: sample})});
  }).then(r=>r.json()).then(function(data) {
    if (data.status !== 'ok') throw new Error(data.message || 'AI 分析失败');
    const r = data.result || {};
    if (status) status.textContent = '✓ AI 测试成功，匹配度: ' + (r.score ?? '?') + '/100';
    addLog('SUCCESS', 'AI 测试成功: 匹配度 ' + (r.score ?? '?') + '/100 —— ' + (r.reason || ''));
  }).catch(function(e) {
    if (status) status.textContent = '✗ 测试失败: ' + e.message;
    addLog('ERROR', 'AI 测试失败: ' + e.message);
  });
}

      '<div class="modal-field"><label>自我介绍</label><textarea id="resumeIntro" placeholder="自我介绍（可用于打招呼消息）" style="min-height:60px">'+escHtml(config.resume.self_intro||'')+'</textarea></div>'+

function closeResumeModal() {
  const m = document.getElementById('resumeModal');
  if (m) m.remove();

function fetchWeeklyReport(days) {
  const summaryEl = document.getElementById('wrSummary');
  const reasonsEl = document.getElementById('wrReasons');
  const statsEl = document.getElementById('wrStats');
  if (summaryEl) summaryEl.textContent = '加载中...';
  fetch('/api/report/weekly?days=' + encodeURIComponent(days))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'ok') throw new Error(data.message || '加载失败');
      const s = data.stats || {};
      const cards = [
        {label:'日志条目', value:s.total || 0, color:'var(--accent)'},
        {label:'成功投递', value:s.applied || 0, color:'var(--success)'},
        {label:'已跳过', value:s.skipped || 0, color:'var(--warning)'},
        {label:'平均匹配分', value:(s.avg_score===null || s.avg_score===undefined) ? '—' : s.avg_score, color:'var(--info)'}
      ];
      if (statsEl) statsEl.innerHTML = cards.map(function(c) {
        return '<div style="padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-soft);border:1px solid var(--bd);border-left:3px solid '+c.color+'">'+
                 '<div style="font-size:11px;color:var(--fg-2nd)">'+c.label+'</div>'+
                 '<div style="font-size:18px;font-weight:600;color:var(--fg);margin-top:2px">'+c.value+'</div>'+
               '</div>';
      }).join('');
      const reasons = s.skip_reasons || [];
      if (reasonsEl) {
        reasonsEl.textContent = reasons.length
          ? reasons.map(function(r) { return r.reason + ' × ' + r.count; }).join('，')
          : '无（所有条目均成功投递）';
      }
      if (summaryEl) {
        if (data.summary) {
          summaryEl.textContent = data.summary;
        } else if (data.ai_available === false) {
          summaryEl.textContent = '（AI 未配置 API Key，仅展示数据统计）';
        } else {
          summaryEl.textContent = '（AI 生成失败，请检查 AI 配置或稍后重试）';
        }
      }
    })
    .catch(function(e) {
      if (statsEl) statsEl.innerHTML = '';
      if (reasonsEl) reasonsEl.textContent = '加载失败';
      if (summaryEl) summaryEl.textContent = '加载失败: ' + e.message;
    });
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('boss-theme', next);
  updateThemeUI(next);
}

function loadTheme() {
  let saved = localStorage.getItem('boss-theme');
  if (!saved) {
    saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeUI(saved);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('boss-theme')) {
      const next = e.matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      updateThemeUI(next);
    }
  });
}

function loadConfig() {
  fetch('/api/config').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(cfg => {
    config = cfg.config || cfg;
    // 填充所有默认值
    if (!config.browser) config.browser = {};
    if (!config.login) config.login = {};
    if (!config.rate_limit) config.rate_limit = {};
    if (!config.retry) config.retry = {};
    config.browser = Object.assign({headless:false,viewport_width:1280,viewport_height:800,page_load_timeout:30,custom_user_agent:'',proxy:'',browser_path:'',user_data_path:''}, config.browser);
    config.login = Object.assign({wait_timeout:300,clear_cookies_on_failure:true}, config.login);
    if (!config.human_verify) config.human_verify = {};
    config.human_verify = Object.assign({enabled:true,wait_timeout:180}, config.human_verify);
    config.rate_limit = Object.assign({enabled:true,max_per_hour:30,max_per_day:100}, config.rate_limit);
    config.retry = Object.assign({max_attempts:3,base_delay:2,backoff_factor:2}, config.retry);
    if (!config.ai) config.ai = {};
    config.ai = Object.assign({enabled:false,api_key:'',api_base:'https://api.agnes-ai.cn/v1',model:'agnes-2.5-flash',match_threshold:70,sort_by_score:true,prefer_active_hr:false,skip_inactive_hr:false,inactive_threshold_hours:72}, config.ai);
    if (!config.resume) config.resume = {};
    config.resume = Object.assign({school:'',major:'',degree:'',skills:[],experience:'',target_position:'',self_intro:''}, config.resume);
    if (!config.monitor) config.monitor = {};
    config.monitor = Object.assign({auto_reply:false,poll_interval_sec:15,max_messages_per_cycle:5,debug_capture:false}, config.monitor);
    if (!config.debug) config.debug = {};
    config.debug = Object.assign({capture:false}, config.debug);
    if (!config.accounts || !config.accounts.length) {
      config.accounts = [{name:'主账号',enabled:true,cookie_file:'zhipin_cookies.json',image_files:[],message_interval_min:3,message_interval_max:8,jobs:[{enabled:true,city:'上海',query:'数据分析',scroll_pages:5,greeting_message:defaultGreeting}]}];
    }
    // 填充每个账号和岗位的默认值
    config.accounts.forEach(function(acc) {
      acc.enabled = acc.enabled !== false;
      acc.cookie_file = acc.cookie_file || 'zhipin_cookies.json';
      acc.image_files = acc.image_files || [];
      acc.message_interval_min = acc.message_interval_min ?? 3;
      acc.message_interval_max = acc.message_interval_max ?? 8;
      (acc.jobs || []).forEach(function(job) {
        job.enabled = job.enabled !== false;
        job.city = job.city || '上海';
        job.query = job.query || '';
        job.scroll_pages = job.scroll_pages || 5;
        job.greeting_message = job.greeting_message || defaultGreeting;
      });
    });
    renderAccounts();
    renderAccountConfig();
    renderAdvSettings();
    renderAiConfig();
    renderMonitorConfig();
    renderJobs();
    updateSbarJobs();
    refreshImageList();
    addLog('SUCCESS', '配置已加载');
  }).catch(function(e){console.error('loadConfig:',e);addLog('ERROR','加载配置失败: '+e.message);});
}

    .then(r=>{if(!r.ok)throw new Error('保存失败: '+r.status);return r.json()})
    .then(d=>{if(d.status!=='ok')throw new Error(d.message||'保存失败');addLog('SYSTEM','配置已保存')})

let dragImageIdx = -1;
function imageDragStart(e) {
  const item = e.target.closest('.image-grid-item');
  if (!item) return;
  dragImageIdx = Array.prototype.indexOf.call(item.parentNode.children, item);
  item.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', String(dragImageIdx)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
}
function imageDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function imageDrop(e) {
  e.preventDefault();
  const target = e.target.closest('.image-grid-item');
  if (!target || dragImageIdx < 0) return;
  const to = Array.prototype.indexOf.call(target.parentNode.children, target);
  if (dragImageIdx === to) return;
  const moved = availableImages.splice(dragImageIdx, 1)[0];
  availableImages.splice(to, 0, moved);
  config.accounts.forEach(function(acc) {
    if (!acc.image_files) return;
    acc.image_files.sort(function(x, y) { return availableImages.indexOf(x) - availableImages.indexOf(y); });
  });
  renderImageGrid();
  renderImageChips();
  saveConfig();
  addLog('INFO', '已调整图片顺序');
}
function imageDragEnd(e) {
  const item = e.target.closest('.image-grid-item');
  if (item) item.classList.remove('dragging');
  dragImageIdx = -1;
}
function previewImage(name) {
  name = decodeURIComponent(name);
  const overlay = document.getElementById('imagePreview');
  const img = document.getElementById('imagePreviewImg');
  const cap = document.getElementById('imagePreviewName');
  if (!overlay || !img) return;
  img.src = '/' + name;
  if (cap) cap.textContent = name.replace(/^dashboard[\\/]+/, "");
  overlay.style.display = 'flex';
}
function closeImagePreview() {
  const overlay = document.getElementById('imagePreview');
  if (overlay) overlay.style.display = 'none';
}
function renameImage(name) {
  name = decodeURIComponent(name);
  const clean = name.replace(/^dashboard[\\/]+/, "");
  const dot = clean.lastIndexOf('.');
  const base = dot > 0 ? clean.slice(0, dot) : clean;
  const ext = dot > 0 ? clean.slice(dot) : '';
  const newBase = prompt('输入新的文件名（不含扩展名）:', base);
  if (!newBase) return;
  const newName = newBase.trim().replace(/[\\/:*?"<>|]/g, '_') + ext;
  if (!newName || newName === clean) return;
  fetch('/api/images/rename', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path: clean, new_name: newName})
  }).then(r=>r.json()).then(data => {
    if (data.status === 'ok') {
      addLog('INFO', '已重命名: ' + clean + ' → ' + data.name);
      loadConfig();
    } else {
      addLog('ERROR', '重命名失败: ' + (data.message||''));
    }
  }).catch(e => addLog('ERROR', '重命名异常: ' + e.message));
}
function toggleImage(name) {
  name = decodeURIComponent(name);
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  if (!a.image_files) a.image_files = [];
  const idx = a.image_files.indexOf(name);
  if (idx >= 0) {
    a.image_files.splice(idx, 1);
  } else {
    a.image_files.push(name);
  }
  renderImageGrid();
  renderImageChips();
  saveConfig();
}
function removeImageChip(name) {
  name = decodeURIComponent(name);
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.image_files) return;
  const i = a.image_files.indexOf(name);
  if (i >= 0) {
    a.image_files.splice(i, 1);
    renderImageGrid();
    renderImageChips();
    saveConfig();
  }
}function renderImageChips() {
  const a = config.accounts[activeAccountIdx];
  const el = document.getElementById("imageChips");
  if (!a || !a.image_files || !a.image_files.length) {

function deleteImageFile(name) { 
  name = decodeURIComponent(name);
  if (!confirm("确定删除图片文件吗？这将从服务器上彻底删除此图片。")) return;
  // 提取纯文件名
  const cleanName = name.replace(/^dashboard[\\/]+/, "");
  fetch("/api/images/delete", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path: cleanName})
  }).then(r=>r.json()).then(data => {
    if (data.status === "ok") {
      addLog("INFO", "已删除图片文件: " + cleanName);
      const ai = availableImages.indexOf(name);
      if (ai >= 0) availableImages.splice(ai, 1);
      const a = config.accounts[activeAccountIdx];
      if (a && a.image_files) {
        a.image_files = a.image_files.filter(f => {
          const fName = f.replace(/^dashboard[\\/]+/, "");
          return fName !== cleanName;
        });
      }
      renderImageGrid();
      renderImageChips();
      saveConfig();
    } else {
      addLog("ERROR", "删除图片失败: " + (data.message||""));
    }
  }).catch(e => addLog("ERROR", "删除图片异常: " + e.message));
}
function deleteAllSelectedImages() {
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.image_files || !a.image_files.length) {
    addLog('INFO', '没有已选的图片需要删除');
    return;
  }
  const count = a.image_files.length;
  if (!confirm('确定删除所有已选的 ' + count + ' 张图片文件吗？这将从服务器上彻底删除这些图片。')) return;
  const filesToDelete = [...a.image_files];
  let deleted = 0;
  let failed = 0;
  const promises = filesToDelete.map(f => {
    return fetch('/api/images/delete', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:f})
    }).then(r=>r.json()).then(data => {
      if (data.status === 'ok') deleted++;
      else failed++;
    }).catch(() => failed++);
  });
  Promise.all(promises).then(() => {
    addLog('INFO', '批量删除完成: ' + deleted + ' 成功, ' + failed + ' 失败');
    // 从所有账号中移除已删除的图片
    for (const acc of config.accounts) {
      if (acc && acc.image_files) {
        acc.image_files = acc.image_files.filter(f => !filesToDelete.includes(f));
      }
    }
    saveConfig();
    refreshImageList();
  });
}

function deleteAllImages() {
  if (!confirm('确定删除所有图片文件吗？此操作不可恢复！')) return;
  fetch('/api/images/delete', {

  }).then(r=>r.json()).then(data => {

      addLog('INFO', '已删除全部 ' + (data.deleted || 0) + ' 张图片');
      for (const acc of config.accounts) {
        if (acc && acc.image_files) {
          acc.image_files = [];
        }
      }
      saveConfig();
      refreshImageList();
    } else {
      addLog('ERROR', '删除失败: ' + (data.message||''));

}

function handleImageUpload(event) {
  const files = event.target.files;
  if (!files || !files.length) return;
  const formData = new FormData();
  for (let i = 0; i < files.length; i++) {
    formData.append("files", files[i]);
  }
  fetch("/api/upload/images", { method:"POST", body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === "ok" && data.files) {
        const a = config.accounts[activeAccountIdx];
        if (a) {
          if (!a.image_files) a.image_files = [];
          for (let f of data.files) {
            if (!a.image_files.includes(f)) {
              a.image_files.push(f);
            }
          }
        }
        addLog("SUCCESS", "已上传 " + data.files.length + " 张图片");
        refreshImageList();
        saveConfig();
      } else {
        addLog("ERROR", "上传失败: " + (data.message || ""));
      }
    })
    .catch(e => addLog("ERROR", "上传异常: " + e.message));
  event.target.value = "";
}
function cleanupStaleImages() {
  fetch('/api/images/list')
    .then(r => r.json())
    .then(data => {
      if (data.status !== 'ok') return;
      const existingImages = data.images || [];
      let changed = false;
      for (const acc of config.accounts) {
        if (acc && acc.image_files && acc.image_files.length) {
          const filtered = acc.image_files.filter(f => existingImages.includes(f));
          if (filtered.length !== acc.image_files.length) {
            acc.image_files = filtered;
            changed = true;
          }
        }
      }
      if (changed) saveConfig();
    })
    .catch(() => {});
}

function refreshImageList() {
  cleanupStaleImages();
  fetch('/api/images/list')
    .then(r=>r.json())
    .then(data => { if (data.status === 'ok') { availableImages = data.images; renderImageGrid(); renderImageChips(); } })
    .catch(()=>{});
}

function positionCityCombo() {
  const input = document.getElementById('modalCity');

  const r = input.getBoundingClientRect();
  const listH = Math.min(220, cityListAll.length * 30 + 12);
  let top = r.bottom + 4;
  if (top + listH > window.innerHeight - 8) top = Math.max(8, r.top - listH - 4);
  l.style.left = r.left + 'px';
  l.style.top = top + 'px';
  l.style.width = r.width + 'px';
}

  }
}

    desc.textContent = '登录已过期或未登录，请在浏览器中完成登录，然后点击下方按钮继续。';
  }
  modal.style.display = 'flex';
  modal.classList.add('active');
  addLog('WARN', '需要登录：请在浏览器中登录后点击确认');
});
socket.on('monitor_status',(data)=>{ if(data) setMonitorControls(!!data.running); });
socket.on('ai_reply_ready',(data)=>{ if(data) renderMonitorReplyCard(data); });
socket.on('ai_reply_sent',(data)=>{ if(data) finalizeMonitorReply(data); });

loadTheme();
loadConfig();
loadCities();
fetch('/api/monitor/status').then(r=>r.json()).then(d=>{ if(d&&d.running) setMonitorControls(true); }).catch(()=>{});
initLayout();

function closeLoginModal() {
  const modal = document.getElementById("loginModal");
  if (modal) {
    modal.style.display = "none";
    modal.classList.remove("active");
  }
  if (socket) socket.emit("stop_login_modal");
}

/* ── 响应式布局：侧栏折叠 + 分割条调节比例 ── */
function toggleSidebar() {
  const app = document.querySelector('.app');
  const narrow = window.matchMedia('(max-width:900px)').matches;
  if (narrow) {
    app.classList.toggle('side-overlay');
    localStorage.setItem('sideOverlay', app.classList.contains('side-overlay') ? '1' : '0');
  } else {
    app.classList.toggle('side-collapsed');
    localStorage.setItem('sideCollapsed', app.classList.contains('side-collapsed') ? '1' : '0');
  }
}
function closeSidebar() {
  const app = document.querySelector('.app');
  app.classList.remove('side-overlay');
  localStorage.setItem('sideOverlay', '0');
}
function initLayout() {
  const app = document.querySelector('.app');
  if (!app) return;
  const storedW = parseInt(localStorage.getItem('sideW') || '', 10);
  if (storedW > 0) document.documentElement.style.setProperty('--side-w', storedW + 'px');
  if (window.matchMedia('(max-width:900px)').matches) {
    if (localStorage.getItem('sideOverlay') === '1') app.classList.add('side-overlay');
  } else if (localStorage.getItem('sideCollapsed') === '1') {
    app.classList.add('side-collapsed');
  }
  initSplitter();
}
function initSplitter() {
  const splitter = document.getElementById('sideSplitter');
  if (!splitter) return;
  let dragging = false;
  function nextWidth(clientX) {
    const minW = 220;
    const maxW = Math.max(300, Math.min(540, window.innerWidth * 0.65));
    return Math.max(minW, Math.min(maxW, clientX));
  }
  function stop() {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('resizing');
    splitter.classList.remove('dragging');
    const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--side-w')) || 360;
    localStorage.setItem('sideW', Math.round(w));
  }
  splitter.addEventListener('pointerdown', function(e) {
    dragging = true;
    document.body.classList.add('resizing');
    splitter.classList.add('dragging');
    try { splitter.setPointerCapture(e.pointerId); } catch (_) {}
    document.documentElement.style.setProperty('--side-w', nextWidth(e.clientX) + 'px');
  });
  splitter.addEventListener('pointermove', function(e) {
    if (dragging) document.documentElement.style.setProperty('--side-w', nextWidth(e.clientX) + 'px');
  });
  splitter.addEventListener('pointerup', stop);
  splitter.addEventListener('pointercancel', stop);
}


function checkCookieLogin() {
  const cookie_file = (document.getElementById('accCookie').value || '').trim() || 'zhipin_cookies.json';
  addLog('INFO', '正在检查登录状态（' + cookie_file + '）...');
  socket.emit('check_cookie_login', {cookie_file: cookie_file});
}

function uploadCookieFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  fetch('/api/cookies/upload', { method:'POST', body: formData })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        addLog('SUCCESS', 'Cookie 已上传: ' + file.name);
        config.accounts[activeAccountIdx].cookie_file = data.filename || file.name;
        renderAccountConfig();
        saveConfig();
      } else {
        addLog('ERROR', 'Cookie 上传失败: ' + (data.message || ''));
      }
    })
    .catch(e => addLog('ERROR', 'Cookie 上传失败: ' + e.message));
  event.target.value = '';
}

function deleteCookieFile() {
  const filename = document.getElementById("accCookie").value || "zhipin_cookies.json";
  if (!confirm("确定删除 Cookie 文件 \"" + filename + "\" 吗？")) return;
  fetch("/api/cookies/delete", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({filename: filename})
  }).then(r=>r.json()).then(data => {
    if (data.status === "ok") {
      addLog("INFO", "已删除 Cookie 文件: " + filename);
      config.accounts[activeAccountIdx].cookie_file = "";
      renderAccountConfig();
      saveConfig();
    } else {
      addLog("ERROR", "删除失败: " + (data.message||""));
    }
  }).catch(e => addLog("ERROR", "删除异常: " + e.message));
}
