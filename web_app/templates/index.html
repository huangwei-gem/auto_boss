<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss直聘 · 自动投递</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e4bd2%22/><text y=%22.67em%22 font-size=%2260%22 x=%2250%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22system-ui,sans-serif%22 font-weight=%22700%22>BZ</text></svg>">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
/* taste-skill: DESIGN_VARIANCE=5, MOTION_INTENSITY=4, VISUAL_DENSITY=5
   Dual theme system — Light / Dark */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* Light Theme */
:root{
  --bg:#f4f5f7;
  --surface:#fff;
  --surface-soft:#f0f2f5;
  --surface-hover:#e8eaf0;
  --accent:#1e4bd2;
  --accent-light:#eef2ff;
  --accent-hover:#163ab5;
  --success:#0f9242;
  --success-bg:#ecfdf5;
  --warning:#d97706;
  --warning-bg:#fffbeb;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --info:#2563eb;
  --info-bg:#eff6ff;
  --fg:#0f1117;
  --fg-2nd:#525866;
  --fg-3rd:#868c98;
  --fg-4th:#b0b5c0;
  --bd:#e3e5ea;
  --bd-2:#c8ccd4;
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:16px;
  --sh-sm:0 1px 2px rgba(0,0,0,.04);
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(0,0,0,.07);
  --sh-lg:0 8px 32px rgba(0,0,0,.09);
  --ease:cubic-bezier(.4,0,.2,1);--dur:.2s;--side-w:320px;--header-h:54px;
  --side-bg:linear-gradient(180deg,#f8f9fb,#eef0f4);
  --side-text:#0f1117;
  --side-input-bg:rgba(0,0,0,.04);
  --side-input-bd:rgba(0,0,0,.08);
  --side-label:rgba(0,0,0,.35);
  --chip-bg:#eef2ff;--chip-text:#1e4bd2;--chip-del:rgba(30,75,210,.3);
  --modal-overlay:rgba(0,0,0,.4);--scrollbar-thumb:#c8ccd4;
  --img-checked-bd:#1e4bd2;--img-checked-bg:rgba(30,75,210,.08);
}

/* Dark Theme */
[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1d27;--surface-soft:#22252f;--surface-hover:#2a2d38;
  --accent:#4a7cff;--accent-light:#1e2a4a;--accent-hover:#6b96ff;
  --success:#34d399;--success-bg:#064e3b;--warning:#fbbf24;--warning-bg:#78350f;
  --danger:#f87171;--danger-bg:#450a0a;--info:#60a5fa;--info-bg:#1e3a5f;
  --fg:#f0f2f5;--fg-2nd:#b0b5c0;--fg-3rd:#6b7280;--fg-4th:#4b5563;
  --bd:#2a2d38;--bd-2:#3b3f4a;
  --sh-sm:0 1px 2px rgba(0,0,0,.2);--sh:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --sh-md:0 4px 16px rgba(0,0,0,.4);--sh-lg:0 8px 32px rgba(0,0,0,.5);
  --side-bg:linear-gradient(180deg,#0f1117,#1a1d27);
  --side-text:#f0f2f5;--side-input-bg:rgba(255,255,255,.05);--side-input-bd:rgba(255,255,255,.08);
  --side-label:rgba(255,255,255,.35);
  --chip-bg:#1e2a4a;--chip-text:#4a7cff;--chip-del:rgba(74,124,255,.3);
  --modal-overlay:rgba(0,0,0,.6);--scrollbar-thumb:#3b3f4a;
  --img-checked-bd:#4a7cff;--img-checked-bg:rgba(74,124,255,.12);
}

/* Theme transitions */
html{transition:color-scheme .3s ease}
body{transition:background-color .3s ease,color .3s ease}

/* Base */
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans SC,sans-serif;font-size:13.5px;line-height:1.55;background:var(--bg);color:var(--fg);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:transparent;width:100%}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
.hidden{display:none!important}

/* Layout */
.app{display:flex;width:100%;height:100%}
.side{flex:0 0 var(--side-w);display:flex;flex-direction:column;background:var(--side-bg);color:var(--side-text);position:relative;z-index:10}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--side-input-bd);flex-shrink:0}
.side-head .logo-wrap{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#4a7cff,#1e4bd2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;flex-shrink:0;box-shadow:0 2px 8px rgba(30,75,210,.4)}
.side-head .logo-text{font-size:14px;font-weight:600;flex:1;letter-spacing:-.02em}
.side-head .conn-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;background:var(--success-bg);color:var(--success)}
.side-head .conn-badge.disconnected{background:var(--danger-bg);color:var(--danger)}
.side-scroll{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.side-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--side-label);margin-bottom:8px;padding:0 4px;display:flex;align-items:center;gap:6px}
.side-section-title .badge-count{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--side-input-bg);color:var(--fg-3rd);font-weight:600}
.side-footer{flex-shrink:0;padding:10px 16px;border-top:1px solid var(--side-input-bd);display:flex;align-items:center;gap:8px;font-size:11px}


/* Advanced settings collapsible */
.adv-toggle{cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:4px;transition:all var(--dur) var(--ease);font-size:10.5px;font-weight:600;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;margin-top:14px;width:100%;border:none;background:none}
.adv-toggle:hover{background:var(--surface-hover);color:var(--fg)}
.adv-toggle .arrow{transition:transform .2s ease;font-size:8px;margin-left:auto}
.adv-toggle.open .arrow{transform:rotate(90deg)}
.adv-section{overflow:hidden;max-height:0;transition:max-height .3s ease;display:flex;flex-direction:column;gap:8px}
.adv-section.open{max-height:2000px}
.adv-field-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2nd);padding:2px 0}
.adv-field-row label{flex-shrink:0;font-size:10.5px;font-weight:500;color:var(--side-label);min-width:56px}
.adv-field-row .side-form-input{flex:1}
.adv-group-title{font-size:10px;font-weight:600;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;padding:4px 0 2px;border-bottom:1px solid var(--side-input-bd)}

/* Account tabs */
.account-tab{display:inline-block;padding:5px 10px;font-size:11.5px;font-weight:500;border-radius:4px;background:var(--side-input-bg);color:var(--fg-2nd);border:1px solid var(--side-input-bd);transition:all var(--dur) var(--ease);cursor:pointer;margin-right:4px;margin-bottom:4px}
.account-tab:hover{background:var(--surface-hover);color:var(--fg)}
.account-tab.active{background:rgba(74,124,255,.15);color:#4a7cff;border-color:rgba(74,124,255,.3)}
.account-tab .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-weight:600;margin-left:4px}
.account-tab.active .badge{background:rgba(74,124,255,.25);color:#4a7cff}

/* Forms */
.side-form-group{display:flex;flex-direction:column;gap:4px}
.side-form-label{font-size:10.5px;font-weight:500;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em}
.side-form-input,.side-form-select{font-size:12px;padding:7px 10px;border-radius:4px;background:var(--side-input-bg);border:1px solid var(--side-input-bd);color:var(--fg);transition:all var(--dur) var(--ease)}
.side-form-input:focus,.side-form-select:focus{border-color:rgba(74,124,255,.5);box-shadow:0 0 0 2px rgba(74,124,255,.15)}
.side-form-input::placeholder{color:var(--fg-4th)}
.side-form-select option{background:var(--surface);color:var(--fg)}
.acc-field-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2nd)}
.acc-field-row label{flex-shrink:0;font-size:10.5px;font-weight:500;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;min-width:48px}

/* File upload */
.file-input-wrap{display:flex;flex:1;gap:4px}
.file-input-wrap .side-form-input{flex:1}
.file-btn{flex-shrink:0;padding:6px 10px;font-size:10.5px;font-weight:500;border-radius:4px;background:rgba(74,124,255,.2);color:#4a7cff;border:1px solid rgba(74,124,255,.25);transition:all var(--dur) var(--ease);white-space:nowrap}
.file-btn:hover{background:rgba(74,124,255,.3)}

/* Toggle switch */
.toggle-switch{position:relative;display:inline-block;width:32px;height:18px;border-radius:9px;background:var(--bd-2);cursor:pointer;transition:all var(--dur) var(--ease);flex-shrink:0}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:all var(--dur) var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle-switch.on{background:var(--accent)}
.toggle-switch.on::after{left:16px;background:#4a7cff}

/* Buttons */
.side-btn-row{display:flex;gap:6px;align-items:center}
.side-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;font-size:11px;font-weight:500;border-radius:4px;transition:all var(--dur) var(--ease);white-space:nowrap}
.side-btn-ghost{background:var(--side-input-bg);color:var(--fg-2nd);border:1px solid var(--side-input-bd)}
.side-btn-ghost:hover{background:var(--surface-hover);color:var(--fg)}
.side-btn-sm{padding:4px 8px;font-size:10px}
.side-btn-danger{color:var(--danger)!important}
.side-btn-block{width:100%}

/* Image multi-select grid */
.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:200px;overflow-y:auto;padding:2px}
.image-grid-item{position:relative;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all var(--dur) var(--ease);aspect-ratio:16/10}
.image-grid-item img{width:100%;height:100%;object-fit:cover;display:block;border-radius:3px}
.image-grid-item .check-overlay{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;transition:all var(--dur) var(--ease);opacity:0}
.image-grid-item.checked{border-color:var(--img-checked-bd);background:var(--img-checked-bg)}
.image-grid-item.checked .check-overlay{opacity:1;background:var(--accent)}
.image-grid-item:hover .check-overlay{opacity:1}
.image-grid-item .img-name{position:absolute;bottom:0;left:0;right:0;padding:3px 6px;font-size:8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-grid-item .img-del-btn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:rgba(220,38,38,.8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s ease;z-index:2;line-height:1}
.image-grid-item:hover .img-del-btn{opacity:1}
.image-grid-item .img-del-btn:hover{background:#dc2626;transform:scale(1.15)}
.image-grid-item .img-del-btn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:rgba(220,38,38,.8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s ease;z-index:2}
.image-grid-item:hover .img-del-btn{opacity:1}
.image-grid-item .img-del-btn:hover{background:#dc2626;transform:scale(1.15)}

/* Chips */
.chip-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;font-size:10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);max-width:100%;transition:all var(--dur) var(--ease)}
.chip .chip-remove{cursor:pointer;font-size:12px;line-height:1;opacity:.6;transition:opacity var(--dur) var(--ease);margin-left:2px;color:var(--chip-del)}
.chip .chip-remove:hover{opacity:1}

/* Sidebar job list */
.sbar-job-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:4px;background:var(--side-input-bg);border:1px solid var(--side-input-bd);cursor:pointer;transition:all var(--dur) var(--ease);margin-bottom:4px}
.sbar-job-item:hover{background:var(--surface-hover)}
.sbar-job-query{font-size:11px;font-weight:500;color:var(--fg)}
.sbar-job-city{font-size:9px;color:var(--fg-3rd);padding:2px 6px;border-radius:3px;background:var(--side-input-bg)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.idle{background:var(--fg-4th)}
.status-dot.running{background:#34d399;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(52,211,153,0)}}
.status-text{font-size:11px;font-weight:500;color:var(--fg-3rd)}
.status-label{font-size:10px;color:var(--fg-4th);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;padding:0 24px;height:var(--header-h);border-bottom:1px solid var(--bd);background:var(--surface);flex-shrink:0;gap:12px}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-.02em}
.topbar-title .highlight{color:var(--accent)}
.topbar-task{font-size:11px;color:var(--fg-3rd);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.topbar-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-light);color:var(--accent);letter-spacing:.02em}

/* Theme toggle button */
.theme-toggle{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;background:var(--surface-soft);border:1px solid var(--bd);transition:all var(--dur) var(--ease);font-size:11px;font-weight:500;color:var(--fg-2nd)}
.theme-toggle:hover{background:var(--surface-hover);color:var(--fg)}
.theme-toggle .toggle-icon{font-size:14px;line-height:1}

/* Content */
.content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{padding:16px 18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--bd);box-shadow:var(--sh-sm);transition:all var(--dur) var(--ease)}
.stat-card:hover{box-shadow:var(--sh);border-color:var(--bd-2)}
.stat-card.accent{border-left:3px solid var(--accent)}
.stat-card.success{border-left:3px solid var(--success)}
.stat-card.warning{border-left:3px solid var(--warning)}
.stat-card.info{border-left:3px solid var(--info)}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3rd)}
.stat-value{font-size:28px;font-weight:700;margin:4px 0;letter-spacing:-.03em;color:var(--fg)}
.stat-sub{font-size:11px;color:var(--fg-3rd)}

/* Button variants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;font-size:12px;font-weight:500;border-radius:var(--r-sm);transition:all var(--dur) var(--ease);white-space:nowrap}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-success{background:var(--success);color:#fff;box-shadow:0 1px 3px rgba(15,146,66,.2)}
.btn-success:hover{opacity:.9;box-shadow:0 2px 8px rgba(15,146,66,.3)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 1px 3px rgba(220,38,38,.2)}
.btn-danger:hover{opacity:.9}
.btn-ghost{background:var(--surface-soft);color:var(--fg-2nd);border:1px solid var(--bd)}
.btn-ghost:hover{background:var(--surface-hover);color:var(--fg)}

/* Panels */
.panel-row{display:flex;gap:16px;flex:1;min-height:0}
.panel{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden}
.panel-half{flex:1}
.panel-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;gap:6px}
.panel-icon{font-size:14px}
.panel-title{font-size:12px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.panel-actions{margin-left:auto;display:flex;gap:4px}
.panel-body{flex:1;overflow-y:auto;padding:8px 12px}

/* Job list */
.job-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);margin-bottom:6px;transition:all var(--dur) var(--ease);cursor:pointer}
.job-item:hover{background:var(--surface-soft);border-color:var(--bd-2)}
.job-item .job-info{flex:1;min-width:0}
.job-item .job-query{font-size:13px;font-weight:500;color:var(--fg)}
.job-item .job-city{font-size:10px;color:var(--fg-3rd);margin-top:1px}
.job-item .job-badge{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--accent-light);color:var(--accent);font-weight:500}
.job-item .job-del{font-size:14px;color:var(--fg-4th);cursor:pointer;padding:2px 4px;border-radius:3px;transition:all var(--dur) var(--ease)}
.job-item .job-del:hover{color:var(--danger);background:var(--danger-bg)}
.job-item .job-toggle{flex-shrink:0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px}
.empty-icon{font-size:32px;opacity:.5}
.empty-title{font-size:14px;font-weight:600;color:var(--fg-2nd)}
.empty-desc{font-size:11px;color:var(--fg-3rd)}

/* Log */
.log-area{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;padding:8px 12px}
.log-entry{padding:2px 0;display:flex;gap:8px;word-break:break-all}
.log-time{color:var(--fg-4th);flex-shrink:0;font-size:10px}
.log-message{flex:1}
.log-SYSTEM,.log-INFO{color:var(--fg-2nd)}
.log-SUCCESS{color:var(--success)}
.log-ERROR{color:var(--danger)}
.log-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px;color:var(--fg-3rd)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:520px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:var(--sh-lg);border:1px solid var(--bd);animation:slideUp .2s ease}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--fg)}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:11px;font-weight:500;color:var(--fg-2nd);margin-bottom:4px}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface-soft);font-size:12px;color:var(--fg);transition:all var(--dur) var(--ease)}
.modal-field input:focus,.modal-field textarea:focus,.modal-field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.modal-field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(30,75,210,.2)}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 2px 8px rgba(30,75,210,.3)}
.btn-cancel{background:var(--surface-soft);color:var(--fg-2nd);border:1px solid var(--bd)}
.btn-cancel:hover{background:var(--surface-hover);color:var(--fg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.panel-row{flex-direction:column}}
@media(max-width:600px){.side{display:none}.stats-grid{grid-template-columns:1fr}.content{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="side-head">
      <div class="logo-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></div>
      <div class="logo-text">Boss直聘</div>
      <span class="conn-badge" id="connStatus">已连接</span>
    </div>
    <div class="side-scroll" id="sideScroll">
      <div>
        <div class="side-section-title">账号 <span class="badge-count" id="accBadge">1</span></div>
        <div id="accountTabs" style="margin-bottom:6px"></div>
        <div class="side-btn-row">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="addAccount()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加</button>
        </div>
      </div>
      <div>
        <div class="side-section-title">账号设置</div>
        <div class="acc-field-row"><label>名称</label><input class="side-form-input" id="accName" type="text" placeholder="主账号" onchange="onAccChange()"></div>
        <div class="acc-field-row"><label>Cookie</label>
          <div class="file-input-wrap">
            <input class="side-form-input" id="accCookie" type="text" placeholder="zhipin_cookies.json" onchange="onAccChange()">
            <button class="file-btn" onclick="document.getElementById('cookieFileInput').click()">上传</button>
            <input type="file" id="cookieFileInput" class="hidden" accept=".json,.txt" onchange="uploadCookieFile(event)">
          </div>
        </div>
        <div class="acc-field-row" style="gap:6px"><label>启用</label><span id="accEnabled" class="toggle-switch on" onclick="toggleAccEnabled()"></span></div>
        <div class="side-section-title" style="margin-top:12px">消息间隔(秒)</div>
        <div class="side-form-group"><label class="side-form-label">最小</label><input class="side-form-input" id="msgIntervalMin" type="number" placeholder="3" onchange="onAccChange()"></div>
        <div class="side-form-group" style="margin-top:6px"><label class="side-form-label">最大</label><input class="side-form-input" id="msgIntervalMax" type="number" placeholder="8" onchange="onAccChange()"></div>
        <div class="side-section-title" style="margin-top:12px">作品图片 <span class="badge-count" id="imageCountBadge">0</span></div>
        <div id="imageGrid" class="image-grid"></div>
        <div id="imageChips" class="chip-list"></div>
        <div class="side-btn-row" style="margin-top:4px;flex-wrap:wrap">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="document.getElementById('imageFileInput').click()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 上传图片</button>
          <input type="file" id="imageFileInput" class="hidden" accept="image/*" multiple onchange="handleImageUpload(event)">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="refreshImageList()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 刷新</button>
          <button class="side-btn side-btn-danger side-btn-sm" onclick="deleteAccount(activeAccountIdx)" style="margin-left:auto;font-size:10px;color:var(--danger)">删除此账号</button>
        </div>
      </div>
      <div style="flex:1">
              <div>
        <button class="adv-toggle" id="advToggle" onclick="toggleAdvSection()">
          ⚙️ 高级设置 <span class="arrow">▶</span>
        </button>
        <div class="adv-section" id="advSection">
          <div class="adv-group-title">浏览器</div>
          <div class="adv-field-row"><label>无头</label><span id="advHeadless" class="toggle-switch" onclick="toggleAdvBool('headless')"></span></div>
          <div class="adv-field-row"><label>宽度</label><input class="side-form-input" id="advViewportW" type="number" placeholder="1280" onchange="onAdvChange()"></div>
          <div class="adv-field-row"><label>高度</label><input class="side-form-input" id="advViewportH" type="number" placeholder="800" onchange="onAdvChange()"></div>
          <div class="adv-field-row"><label>超时(s)</label><input class="side-form-input" id="advTimeout" type="number" placeholder="30" onchange="onAdvChange()"></div>
          <div class="adv-field-row"><label>UA</label><input class="side-form-input" id="advUserAgent" type="text" placeholder="留空自动" onchange="onAdvChange()"></div>
          <div class="adv-field-row"><label>代理</label><input class="side-form-input" id="advProxy" type="text" placeholder="http://..." onchange="onAdvChange()"></div>
        </div>
      </div>

        <div class="side-section-title">岗位列表</div>
        <div id="sbarJobs" style="display:flex;flex-direction:column"></div>
        <button class="side-btn side-btn-ghost side-btn-sm side-btn-block" onclick="addJob()" style="margin-top:6px">+ 添加岗位</button>
      </div>
    </div>
    <div class="side-footer">
      <div class="status-dot idle" id="sbarDot"></div>
      <span class="status-text" id="sbarStatus">就绪</span>
      <span class="status-label" id="currentTaskLabel"></span>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="highlight">AI</span> 自动投递</div>
      <div class="topbar-task" id="topbarTask"></div>
      <div class="topbar-right">
        <span class="topbar-badge">v2.0</span>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
          <span class="toggle-icon" id="themeIcon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
          <span id="themeLabel">亮色</span>
        </button>
      </div>
    </div>
    <div class="content">
      <div class="stats-grid">
        <div class="stat-card accent"><div class="stat-label">总任务</div><div class="stat-value" id="statTotal">0</div><div class="stat-sub">全部任务</div></div>
        <div class="stat-card success"><div class="stat-label">已投递</div><div class="stat-value" id="statApplied">0</div><div class="stat-sub">成功投递</div></div>
        <div class="stat-card warning"><div class="stat-label">已跳过</div><div class="stat-value" id="statSkipped">0</div><div class="stat-sub">已过滤</div></div>
        <div class="stat-card info"><div class="stat-label">操作</div>
          <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
            <button class="btn btn-success btn-sm" id="btnStartAll" onclick="startAll()">▶ 启动</button>
            <button class="btn btn-danger btn-sm" id="btnStopAll" onclick="stopAll()" style="display:none">■ 停止</button>
            <button class="btn btn-ghost btn-sm" id="btnConfirmLogin" onclick="confirmLogin()" style="display:none">✓ 确认登录</button>
            <button class="btn btn-ghost btn-sm" onclick="saveConfig()">💾 保存配置</button>
          </div>
        </div>
      </div>
      <div class="panel-row">
        <div class="panel panel-half">
          <div class="panel-header"><span class="panel-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span class="panel-title">岗位管理</span><div class="panel-actions"><button class="btn btn-ghost btn-sm" onclick="addJob()">+ 添加</button></div></div>
          <div class="panel-body" id="jobList"></div>
        </div>
        <div class="panel panel-half">
          <div class="panel-header"><span class="panel-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span><span class="panel-title">运行日志</span><div class="panel-actions"><button class="btn btn-ghost btn-sm" onclick="clearLog()">清空</button></div></div>
          <div class="panel-body log-area" id="logArea"><div class="log-empty"><div class="empty-icon">📝</div><div>等待操作...</div></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const socket = io();
let config = { accounts: [] };
let activeAccountIdx = 0;
let stats = { total: 0, applied: 0, skipped: 0 };
let availableImages = [];

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('boss-theme', next);
  updateThemeUI(next);
}

function loadTheme() {
  let saved = localStorage.getItem('boss-theme');
  if (!saved) {
    saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeUI(saved);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('boss-theme')) {
      const next = e.matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      updateThemeUI(next);
    }
  });
}

function updateThemeUI(theme) {
  document.getElementById('themeIcon').innerHTML = theme === 'dark' ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  document.getElementById('themeLabel').textContent = theme === 'dark' ? '暗色' : '亮色';
}

function clearLog() {
  document.getElementById('logArea').innerHTML = '<div class="log-empty"><div class="empty-icon">📝</div><div>等待操作...</div></div>';
}

const defaultGreeting = '您好，我是双一流的本科，应聘数据分析岗位。在校系统学习数据分析相关知识，掌握Excel、基础SQL与数据整理技能，具备数据思维。做事严谨细心，学习能力强，愿意踏实积累。十分认可贵公司，希望能获得面试机会。';

function loadConfig() {
  fetch('/api/config').then(r=>r.json()).then(cfg => {
    config = cfg;
    if (!config.accounts || !config.accounts.length) {
      config.accounts = [{name:'主账号',enabled:true,cookie_file:'zhipin_cookies.json',image_files:[],message_interval_min:3,message_interval_max:8,jobs:[{enabled:true,city:'上海',query:'AI产品经理',scroll_pages:5,greeting_message:'您好，我是双一流的本科，应聘数据分析岗位。在校系统学习数据分析相关知识，掌握Excel、基础SQL与数据整理技能，具备数据思维。做事严谨细心，学习能力强，愿意踏实积累。十分认可贵公司，希望能获得面试机会。'}]}];
    }
    renderAccounts();
    renderAccountConfig();
    renderAdvSettings();
    renderJobs();
    updateSbarJobs();
    refreshImageList();
  }).catch(()=>{});
}

function saveConfig() {
  return fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}).then(r=>r.json()).then(()=>{addLog('SYSTEM','配置已保存')});
}

function renderAccounts() {
  const c = document.getElementById('accountTabs');
  const badge = document.getElementById('accBadge');
  c.innerHTML = config.accounts.map((a,i) =>
    '<div class="account-tab'+(i===activeAccountIdx?' active':'')+'" onclick="switchAccount('+i+')">'+escHtml(a.name||'未命名')+'<span class="badge">'+(a.jobs||[]).length+'</span></div>'
  ).join('');
  if (badge) badge.textContent = config.accounts.length;
}


function renderAdvSettings() {
  const b = config.browser || {};
  document.getElementById('advHeadless').className = 'toggle-switch' + (b.headless ? ' on' : '');
  document.getElementById('advViewportW').value = b.viewport_width || '';
  document.getElementById('advViewportW').placeholder = '1280';
  document.getElementById('advViewportH').value = b.viewport_height || '';
  document.getElementById('advViewportH').placeholder = '800';
  document.getElementById('advTimeout').value = b.page_load_timeout || '';
  document.getElementById('advTimeout').placeholder = '30';
  document.getElementById('advUserAgent').value = b.custom_user_agent || '';
  document.getElementById('advUserAgent').placeholder = '留空自动';
  document.getElementById('advProxy').value = b.proxy || '';
  document.getElementById('advProxy').placeholder = 'http://...';

  const rl = config.rate_limit || {};
  document.getElementById('advRateLimit').className = 'toggle-switch' + (rl.enabled !== false ? ' on' : '');
  document.getElementById('advRatePerHour').value = rl.max_per_hour || '';
  document.getElementById('advRatePerHour').placeholder = '30';
  document.getElementById('advRatePerDay').value = rl.max_per_day || '';
  document.getElementById('advRatePerDay').placeholder = '100';

  const lg = config.login || {};
  document.getElementById('advLoginWait').value = lg.wait_timeout || '';
  document.getElementById('advLoginWait').placeholder = '300';
  document.getElementById('advClearCookies').className = 'toggle-switch' + (lg.clear_cookies_on_failure !== false ? ' on' : '');

  const rt = config.retry || {};
  document.getElementById('advRetryAttempts').value = rt.max_attempts || '';
  document.getElementById('advRetryAttempts').placeholder = '3';
  document.getElementById('advRetryDelay').value = rt.base_delay || '';
  document.getElementById('advRetryDelay').placeholder = '2';
  document.getElementById('advRetryBackoff').value = rt.backoff_factor || '';
  document.getElementById('advRetryBackoff').placeholder = '2';
}

function toggleAdvSection() {
  const btn = document.getElementById('advToggle');
  const section = document.getElementById('advSection');
  section.classList.toggle("open");
  btn.classList.toggle("open");
}

function toggleAdvBool(key) {
  if (key === "headless") {
    if (!config.browser) config.browser = {};
    config.browser.headless = !config.browser.headless;
    document.getElementById('advHeadless').className = 'toggle-switch' + (config.browser.headless ? ' on' : '');
  } else if (key === "rate_limit_enabled") {
    if (!config.rate_limit) config.rate_limit = {};
    config.rate_limit.enabled = !config.rate_limit.enabled;
    document.getElementById('advRateLimit').className = 'toggle-switch' + (config.rate_limit.enabled !== false ? ' on' : '');
  } else if (key === "clear_cookies") {
    if (!config.login) config.login = {};
    config.login.clear_cookies_on_failure = !config.login.clear_cookies_on_failure;
    document.getElementById('advClearCookies').className = 'toggle-switch' + (config.login.clear_cookies_on_failure !== false ? ' on' : '');
  }
}

function onAdvChange() {
  if (!config.browser) config.browser = {};
  config.browser.headless = document.getElementById('advHeadless').classList.contains('on');
  config.browser.viewport_width = parseInt(document.getElementById('advViewportW').value) || 1280;
  config.browser.viewport_height = parseInt(document.getElementById('advViewportH').value) || 800;
  config.browser.page_load_timeout = parseInt(document.getElementById('advTimeout').value) || 30;
  config.browser.custom_user_agent = document.getElementById('advUserAgent').value;
  config.browser.proxy = document.getElementById('advProxy').value;

  if (!config.rate_limit) config.rate_limit = {};
  config.rate_limit.enabled = document.getElementById('advRateLimit').classList.contains('on');
  config.rate_limit.max_per_hour = parseInt(document.getElementById('advRatePerHour').value) || 30;
  config.rate_limit.max_per_day = parseInt(document.getElementById('advRatePerDay').value) || 100;

  if (!config.login) config.login = {};
  config.login.wait_timeout = parseInt(document.getElementById('advLoginWait').value) || 300;
  config.login.clear_cookies_on_failure = document.getElementById('advClearCookies').classList.contains('on');

  if (!config.retry) config.retry = {};
  config.retry.max_attempts = parseInt(document.getElementById('advRetryAttempts').value) || 3;
  config.retry.base_delay = parseFloat(document.getElementById('advRetryDelay').value) || 2.0;
  config.retry.backoff_factor = parseFloat(document.getElementById('advRetryBackoff').value) || 2.0;

}


function renderAccountConfig() {
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  document.getElementById('accName').value = a.name||'';
  document.getElementById('accName').placeholder = '主账号';
  document.getElementById('accEnabled').className = 'toggle-switch'+(a.enabled!==false?' on':'');
  document.getElementById('accCookie').value = a.cookie_file||'';
  document.getElementById('accCookie').placeholder = 'zhipin_cookies.json';
  document.getElementById('msgIntervalMin').value = (a.message_interval_min !== undefined && a.message_interval_min !== null) ? a.message_interval_min : 3;
  document.getElementById('msgIntervalMax').value = (a.message_interval_max !== undefined && a.message_interval_max !== null) ? a.message_interval_max : 8;
  renderImageChips();
  renderImageGrid();
}

function renderJobs() {
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  const c = document.getElementById('jobList');
  if (!a.jobs || !a.jobs.length) {
    c.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">暂无岗位</div><div class="empty-desc">点击上方「+ 添加岗位」按钮添加</div></div>';
    return;
  }
  c.innerHTML = a.jobs.map((j,i) =>
    '<div class="job-item">'+
      '<span class="job-toggle toggle-switch'+(j.enabled!==false?' on':'')+'" onclick="event.stopPropagation();toggleJob('+i+')"></span>'+
      '<div class="job-info" onclick="editJob('+i+')">'+
        '<div class="job-query">'+escHtml(j.query||'')+'</div>'+
        '<div class="job-city">'+escHtml(j.city||'')+(j.scroll_pages?' · '+j.scroll_pages+'页':'')+'</div>'+
      '</div>'+
      '<span class="job-badge">'+(j.city||'')+'</span>'+
      '<span class="job-del" onclick="event.stopPropagation();deleteJob('+i+')" title="删除">✕</span>'+
    '</div>'
  ).join('');
}

function updateSbarJobs() {
  const a = config.accounts[activeAccountIdx];
  const el = document.getElementById('sbarJobs');
  if (a && a.jobs && a.jobs.length) {
    el.innerHTML = a.jobs.map((j,i) => '<div class="sbar-job-item" onclick="editJob('+i+')"><span class="sbar-job-query">'+escHtml(j.query||'')+'</span><span class="sbar-job-city">'+escHtml(j.city||'')+'</span></div>').join('');
  } else {
    el.innerHTML = '<span style="color:var(--fg-3rd);font-size:10px;">0 个岗位</span>';
  }
}

function renderImageGrid() {
  const grid = document.getElementById('imageGrid');
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  const selected = a.image_files || [];
  if (!availableImages.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--fg-3rd);font-size:11px">暂无图片，点击上传</div>';
    return;
  }
  grid.innerHTML = availableImages.map(f => {
    const checked = selected.includes(f);
    return '<div class="image-grid-item'+(checked?' checked':'')+'" onclick="toggleImageSelect(\'"+escAttr(f)+'\')">'+\
      '<div class=\"img-del-btn\" onclick=\"event.stopPropagation();deleteImageFile(\'"+escAttr(f)+'\')\" title=\"删除此图片\">✖</div>'+\
      '<img src="/'+f+'" alt="'+escAttr(f)+'" loading="lazy" onerror="this.style.display=\'none\'">'+
      '<div class="check-overlay">✓</div>'+
      '<div class="img-name">'+escHtml(f.replace('dashboard/',''))+'</div>'+
    '</div>';
  }).join('');
  updateImageCountBadge();
}

function toggleImageSelect(name) { name = decodeURIComponent(name);
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  if (!a.image_files) a.image_files = [];
  const idx = a.image_files.indexOf(name);
  if (idx >= 0) { a.image_files.splice(idx, 1); }
  else { a.image_files.push(name); }
  renderImageGrid();
  renderImageChips();
}

function renderImageChips() {
  const a = config.accounts[activeAccountIdx];
  const el = document.getElementById('imageChips');
  if (!a || !a.image_files || !a.image_files.length) {
    el.innerHTML = '';
    updateImageCountBadge();
    return;
  }
  el.innerHTML = a.image_files.map(f =>
    '<span class="chip">'+escHtml(f.replace('dashboard/',''))+'<span class="chip-remove" onclick="removeImage(\''+escAttr(f)+'\')">✕</span></span>'
  ).join('');
  updateImageCountBadge();
}

function updateImageCountBadge() {
  const a = config.accounts[activeAccountIdx];
  const badge = document.getElementById('imageCountBadge');
  if (badge) badge.textContent = (a && a.image_files) ? a.image_files.length : 0;
}

function removeImage(name) {
  name = decodeURIComponent(name);
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  a.image_files = (a.image_files||[]).filter(f => {
    const fName = f.replace('dashboard/', '');
    const delName = name.replace('dashboard/', '');
    return fName !== delName;
  });
  renderImageGrid();
  renderImageChips();
  fetch('/api/images/delete', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({filename:name})
  }).then(r=>r.json()).then(data => {
    if (data.status === 'ok') {
      addLog('INFO', '已删除图片: ' + name);
      refreshImageList();
    } else {
      addLog('ERROR', '删除图片失败: ' + (data.message||''));
    }
  }).catch(e => addLog('ERROR', '删除图片异常: ' + e.message));
}



function deleteImageFile(name) { name = decodeURIComponent(name);
  if (!confirm('确定删除图片文件吗？这将从服务器上彻底删除此图片。')) return;
  fetch('/api/images/delete', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({filename:name})
  }).then(r=>r.json()).then(data => {
    if (data.status === 'ok') {
      addLog('INFO', '已删除图片文件: ' + name);
      // 只从当前账号的image_files中移除
      const a = config.accounts[activeAccountIdx];
      if (a && a.image_files) {
        a.image_files = a.image_files.filter(f => {
          // 匹配文件名（考虑路径前缀）
          const fName = f.replace('dashboard/', '');
          const delName = name.replace('dashboard/', '');
          return fName !== delName;
        });
      }
      refreshImageList();
    } else {
      addLog('ERROR', '删除失败: ' + (data.message||''));
    }
  }).catch(e => addLog('ERROR', '删除异常: ' + e.message));
}

function handleImageUpload(event) {
  const files = event.target.files;
  if (!files || !files.length) return;
  const formData = new FormData();
  for (let f of files) { formData.append('files', f); }
  fetch('/api/upload/images', { method:'POST', body:formData })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        addLog('INFO', '已上传 ' + data.files.length + ' 张图片');
        const a = config.accounts[activeAccountIdx];
        if (a) {
          if (!a.image_files) a.image_files = [];
          for (let f of data.files) { if (!a.image_files.includes(f)) { a.image_files.push(f); } }
        }
        refreshImageList();
      } else { addLog('ERROR', '上传失败: ' + (data.message||'')); }
    })
    .catch(e => addLog('ERROR', '上传异常: ' + e.message));
  event.target.value = '';
}

function refreshImageList() {
  fetch('/api/images/list')
    .then(r=>r.json())
    .then(data => { if (data.status === 'ok') { availableImages = data.images; renderImageGrid(); renderImageChips(); } })
    .catch(()=>{});
}

function uploadCookieFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  fetch('/api/upload/cookie', { method:'POST', body:formData })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        document.getElementById('accCookie').value = data.filename;
        onAccChange();
        addLog('INFO', 'Cookie文件已上传: ' + data.filename);
      } else { addLog('ERROR', '上传失败: ' + (data.message||'')); }
    })
    .catch(e => addLog('ERROR', '上传异常: ' + e.message));
  event.target.value = '';
}

function switchAccount(i) { activeAccountIdx = i; renderAccounts(); renderAccountConfig(); renderJobs(); updateSbarJobs(); }

function onAccChange() {
  onAdvChange();
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  a.name = document.getElementById('accName').value;
  a.cookie_file = document.getElementById('accCookie').value;
  a.message_interval_min = parseFloat(document.getElementById('msgIntervalMin').value) || 3;
  a.message_interval_max = parseFloat(document.getElementById('msgIntervalMax').value) || 8;
}

function toggleAccEnabled() {
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  a.enabled = a.enabled === false;
  renderAccountConfig();
}

function toggleJob(i) {
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.jobs || !a.jobs[i]) return;
  a.jobs[i].enabled = a.jobs[i].enabled === false;
  renderJobs();
  updateSbarJobs();
}

let editingJobIdx = -1;

function addJob() {
  editingJobIdx = -1;
  showJobModal({enabled:true,city:'',query:'',scroll_pages:5,greeting_message:defaultGreeting});
}

function editJob(i) {
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.jobs || !a.jobs[i]) return;
  editingJobIdx = i;
  showJobModal(Object.assign({}, a.jobs[i]));
}

function showJobModal(job) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'jobModal';
  overlay.innerHTML =
    '<div class="modal">'+
      '<h3>'+(editingJobIdx>=0?'编辑岗位':'添加岗位')+'</h3>'+
      '<div class="modal-field"><label>城市</label><input id="modalCity" value="'+escAttr(job.city||'')+'" placeholder="例如: 上海"></div>'+
      '<div class="modal-field"><label>搜索关键词</label><input id="modalQuery" value="'+escAttr(job.query||'')+'" placeholder="例如: AI产品经理"></div>'+
      '<div class="modal-field"><label>翻页数</label><input id="modalPages" type="number" value="'+(job.scroll_pages||5)+'" min="1" max="20"></div>'+
      '<div class="modal-field"><label>打招呼消息</label><textarea id="modalGreeting" placeholder="输入自定义打招呼消息...">'+escHtml(job.greeting_message||'')+'</textarea></div>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-primary" onclick="saveJobModal()">'+(editingJobIdx>=0?'保存':'添加')+'</button>'+
        '<button class="btn btn-cancel" onclick="closeJobModal()">取消</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
}

function closeJobModal() {
  const m = document.getElementById('jobModal');
  if (m) m.remove();
}

function saveJobModal() {
  const city = document.getElementById('modalCity').value.trim();
  const query = document.getElementById('modalQuery').value.trim();
  const pages = parseInt(document.getElementById('modalPages').value) || 5;
  const greeting = document.getElementById('modalGreeting').value.trim() || defaultGreeting;
  if (!city || !query) { addLog('ERROR','城市和关键词不能为空'); return; }
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  if (!a.jobs) a.jobs = [];
  const job = { enabled:true, city, query, scroll_pages:pages, greeting_message:greeting };
  if (editingJobIdx >= 0 && editingJobIdx < a.jobs.length) {
    a.jobs[editingJobIdx] = job;
    addLog('INFO', '岗位已更新: ' + query);
  } else {
    a.jobs.push(job);
    addLog('INFO', '岗位已添加: ' + query);
  }
  closeJobModal();
  renderJobs();
  updateSbarJobs();
}

function deleteJob(i) {
  if (!confirm('确定删除此岗位？')) return;
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.jobs) return;
  a.jobs.splice(i, 1);
  renderJobs();
  updateSbarJobs();
  addLog('INFO', '岗位已删除');
}

function addAccount() {
  fetch('/api/config/accounts', { method:'POST' })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        config.accounts = data.accounts;
        activeAccountIdx = config.accounts.length - 1;
        renderAccounts();
        renderAccountConfig();
        renderJobs();
        updateSbarJobs();
        addLog('INFO', '已添加新账号');
      } else { addLog('ERROR', '添加账号失败'); }
    })
    .catch(e => addLog('ERROR', '添加账号异常: ' + e.message));
}

function deleteAccount(i) {
  if (!confirm('确定删除账号「' + (config.accounts[i]?.name || '账号'+(i+1)) + '」？')) return;
  onAccChange();
  fetch('/api/config/accounts/' + i, { method:'DELETE' })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        config.accounts = data.accounts;
        if (activeAccountIdx >= config.accounts.length) activeAccountIdx = Math.max(0, config.accounts.length - 1);
        renderAccounts();
        renderAccountConfig();
        renderJobs();
        updateSbarJobs();
        addLog('INFO', '已删除账号');
      } else { addLog('ERROR', '删除账号失败'); }
    })
    .catch(e => addLog('ERROR', e.message));
}

function startAll() {
  fetch('/api/scheduler/reset', { method:'POST' }).then(() => {
    saveConfig().then(()=>{ socket.emit('start_all'); addLog('SYSTEM','正在启动所有任务...'); });
  });
}

function stopAll() { socket.emit('stop_all'); addLog('SYSTEM','正在停止所有任务...'); }

function confirmLogin() { socket.emit('confirm_login'); }

function checkLogin() { socket.emit('check_login'); }

function setControls(running) {
  const s=document.getElementById('btnStartAll'),p=document.getElementById('btnStopAll'),cl=document.getElementById('btnConfirmLogin'),dot=document.getElementById('sbarDot'),st=document.getElementById('sbarStatus');
  if(s) s.style.display=running?'none':'';
  if(p) p.style.display=running?'':'none';
  if(cl) cl.style.display=running?'':'none';
  if(dot) dot.className='status-dot'+(running?' running':' idle');
  if(st) st.textContent=running?'运行中':'就绪';
}

function updateStats() {
  const t=document.getElementById('statTotal'),a=document.getElementById('statApplied'),s=document.getElementById('statSkipped');
  if(t) t.textContent=stats.total; if(a) a.textContent=stats.applied; if(s) s.textContent=stats.skipped;
}

function escHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function escAttr(t){return encodeURIComponent(t||'');}

function addLog(level,message){
  const area=document.getElementById('logArea');
  const empty=area.querySelector('.log-empty');
  if(empty) empty.remove();
  const div=document.createElement('div');div.className='log-entry';
  const ts=new Date().toLocaleTimeString();
  div.innerHTML='<span class="log-time">'+ts+'</span><span class="log-message log-'+level+'">'+escHtml(message)+'</span>';
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
  while(area.children.length>300) area.removeChild(area.firstChild);
}


function resetScheduler() {
  fetch('/api/scheduler/reset', { method:'POST' })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        addLog('SYSTEM', '调度器状态已重置');
        setControls(false);
      }
    })
    .catch(()=>{});
}

socket.on('connect',()=>{addLog('SYSTEM','WebSocket 已连接');document.getElementById('connStatus').textContent='已连接';resetScheduler();});
socket.on('disconnect',()=>{addLog('ERROR','WebSocket 断开');document.getElementById('connStatus').textContent='已断开';});
socket.on('bot_log',(data)=>{if(data&&data.message) addLog('INFO',data.message);});
socket.on('bot_progress',(data)=>{
  if(data.total!==undefined) stats.total=data.total;
  if(data.applied!==undefined) stats.applied=data.applied;
  if(data.skipped!==undefined) stats.skipped=data.skipped;
  updateStats();
});
socket.on('bot_status',(data)=>{setControls(data.running);if(!data.running)document.getElementById('currentTaskLabel').textContent='';});
socket.on('scheduler_status',(data)=>{
  setControls(data.running);
  const lbl=document.getElementById('currentTaskLabel');
  if(data.current&&lbl) lbl.textContent=data.current.account+' / '+data.current.query+'('+data.current.city+')';
  else if(!data.running&&lbl) lbl.textContent='';
});
socket.on('bot_login',()=>{document.getElementById('btnConfirmLogin').disabled=false;});
socket.on('login_result',(data)=>{if(data.success)addLog('SUCCESS','登录状态正常');else addLog('ERROR','未登录');});

loadTheme();
loadConfig();
</script>
</body>
</html>
